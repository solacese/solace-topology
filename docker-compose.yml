services:
  neo4j:
    image: neo4j:5-community
    container_name: solace-topology-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/solace-topology
      NEO4J_dbms_security_auth__enabled: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solace-topology-api
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TOPOLOGY_CONFIG_PATH: /workspace/config/topology.yaml
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./config:/workspace/config:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: solace-topology-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  neo4j-data:
  neo4j-logs:
